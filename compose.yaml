name: ulpf

services:
  ulpf:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - serve
      - --listen=0.0.0.0:8080
      - --sqlite=/var/lib/ulpf/state/ulpf.sqlite
      - --raw-root=/var/lib/ulpf/raw
      - --tenant=${ULPF_TENANT:-demo}
      - --workers=${ULPF_WORKERS:-2}
    environment:
      ULPF_API_TOKEN: ${ULPF_API_TOKEN:?set ULPF_API_TOKEN to a 32+ character secret}
    ports:
      - "${ULPF_HTTP_PORT:-8080}:8080"
    volumes:
      - ulpf-raw:/var/lib/ulpf/raw
      - ulpf-state:/var/lib/ulpf/state
    read_only: true
    tmpfs:
      - /var/lib/ulpf/tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/ulpf", "healthcheck", "--url=http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.3.8.23-alpine@sha256:a3b420cf59bed0541044f7de2e3d6c8ef6a844114cc6d997ec1207cbc7e81249
    environment:
      CLICKHOUSE_DB: ulpf
      CLICKHOUSE_USER: ulpf
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD to a non-default secret}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  ulpf-raw:
  ulpf-state:
  clickhouse-data:
  clickhouse-logs:
