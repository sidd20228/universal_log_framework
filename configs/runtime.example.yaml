config_version: ulpf-config/1
deployment:
  environment_id: demo
  instance_id: node-1
  tenant_id: demo
  api_token_ref: env:ULPF_API_TOKEN
listeners:
  - id: http-8080
    kind: http
    address: 0.0.0.0:8080
    max_event_bytes: 1048576
    source_profile_id: enterprise-demo
source_profiles:
  - id: enterprise-demo
    tenant_id: demo
    bundle_directory: /usr/share/ulpf/bundles/demo/enterprise
processing:
  workers: 2
  parser_timeout: 2s
  detection_threshold: 0.8
  ambiguity_margin: 0.1
storage:
  raw_root: /var/lib/ulpf/raw
  sqlite_path: /var/lib/ulpf/state/ulpf.sqlite
  bundle_root: /var/lib/ulpf/bundles
  high_watermark_percent: 85
retention:
  raw_days: 7
connectors:
  - id: normalized-clickhouse
    kind: clickhouse
    required: true
    batch_size: 500
    endpoint: http://clickhouse:8123
    database: ulpf
    table: events
    username: ulpf
    password_ref: env:CLICKHOUSE_PASSWORD
    query_backend: true
